name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_DB: docintel
          POSTGRES_USER: docintel
          POSTGRES_PASSWORD: docintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docintel -d docintel"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://docintel:docintel@localhost:5432/docintel
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      OPENAI_GENERATION_MODEL: gpt-5.6-terra

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.4"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14.7
      - name: Synchronize locked dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src tests
      - name: Migrate empty database
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest
      - name: Deterministic evaluation
        run: uv run python -m evals.run --mode deterministic
