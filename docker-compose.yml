services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: docintel
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel
    ports:
      - "127.0.0.1:${DOCINTEL_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel -d docintel"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - docintel_postgres_data:/var/lib/postgresql

volumes:
  docintel_postgres_data:
