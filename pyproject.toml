[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docintel-lite"
version = "1.0.0"
description = "Evidence-grounded question answering for textual PDF documents"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.140.6",
    "openai==3.1.0",
    "psycopg[binary]",
    "pydantic==2.13.4",
    "pydantic-settings",
    "pypdf==6.16.1",
    "python-multipart",
    "sqlalchemy==2.0.52",
    "tiktoken==0.13.0",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "database: requires the configured PostgreSQL/pgvector database",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
